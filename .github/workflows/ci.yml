name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typen, Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          # Wegwerf-Datenbank nur für diesen Lauf, kein Geheimnis.
          POSTGRES_USER: rdw
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: rdw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rdw -d rdw"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgres://rdw:ci-only-not-a-secret@localhost:5432/rdw
      TEST_DATABASE_URL: postgres://rdw:ci-only-not-a-secret@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Formatierung
        run: pnpm format:check
      - name: Typprüfung
        run: pnpm typecheck
      - name: Unit-Tests
        run: pnpm test
      - name: Fragen prüfen
        run: pnpm content:validate
      - name: Integrationstests (PostgreSQL)
        run: pnpm test:integration
      - name: Migrationen auf leere Datenbank
        run: pnpm db:migrate
